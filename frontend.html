
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustVault | Secure Documents</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
header{background:#172554;color:white;padding:22px 7%;display:flex;justify-content:space-between;align-items:center}
header h2{margin:0}
main{max-width:1000px;margin:32px auto;padding:0 18px}
.card{background:white;padding:22px;border-radius:12px;margin-bottom:20px;box-shadow:0 3px 14px #0000000b}
input,select,button{padding:11px;margin:6px 4px 6px 0;border:1px solid #cbd5e1;border-radius:7px}
input{max-width:100%}
button{background:#2563eb;color:white;border:0;cursor:pointer}
button:hover{background:#1d4ed8}
.hidden{display:none}
#message{padding:10px;white-space:pre-wrap}
.doc{padding:12px;border-bottom:1px solid #e2e8f0}
</style>
</head>
<body>
<header>
  <h2>🔐 TrustVault</h2>
  <span>Secure Document Management</span>
</header>
<main>
  <section class="card" id="loginBox">
    <h2>Welcome back</h2>
    <p>Sign in to access your documents.</p>
    <form id="loginForm">
      <input id="username" placeholder="Username" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </section>

  <section id="dashboard" class="hidden">
    <div class="card">
      <h2>Document Dashboard</h2>
      <p id="welcome"></p>
      <button onclick="loadDocuments()">Refresh documents</button>
      <button onclick="logout()">Logout</button>
      <p id="message"></p>
    </div>
    <div class="card">
      <h3>Upload a document</h3>
      <form id="uploadForm">
        <input type="file" id="documentFile" required>
        <input id="category" placeholder="Category" value="General" required>
        <button type="submit">Upload</button>
      </form>
    </div>
    <div class="card">
      <h3>Search documents</h3>
      <input id="searchName" placeholder="Document name">
      <input id="searchOwner" placeholder="Owner username">
      <input id="searchCategory" placeholder="Category">
      <input id="searchDate" type="date">
      <button onclick="searchDocuments()">Search</button>
      <button onclick="loadDocuments()">Show all</button>
      <div id="documents"></div>
    </div>
  </section>
</main>
<script>
const API = "http://127.0.0.1:8000";
let token = "";
let currentUsername = "";

function showMessage(text) {
  document.getElementById("message").textContent = text;
}

async function request(url, options={}) {
  options.headers = {...(options.headers || {}), Authorization: "Bearer " + token};
  const response = await fetch(API + url, options);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.detail || "Request failed: " + response.status);
  return data;
}

document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
   try {
    const response = await fetch(API + "/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.detail || "Login failed");
    }

    token = data.access_token;
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    showMessage("Login successful!");
    loadDocuments();

  } catch (err) {
    alert("Login failed: " + err.message);
}
  });

async function loadDocuments() {
  try {
    const data = await request("/documents");
    renderDocuments(data.documents || []);
    showMessage("Documents loaded.");
  } catch(err) { showMessage(err.message); }
}

async function searchDocuments() {
  try {
    const params = new URLSearchParams({
      name:document.getElementById("searchName").value,
      owner:document.getElementById("searchOwner").value,
      category:document.getElementById("searchCategory").value,
      date:document.getElementById("searchDate").value
    });
    const data = await request("/documents/search?" + params);
    renderDocuments(data.documents || []);
    showMessage("Search complete.");
  } catch(err) { showMessage(err.message); }
}

function renderDocuments(docs) {
  const area = document.getElementById("documents");
  area.replaceChildren();
  if (!docs.length) { area.textContent = "No accessible documents found."; return; }
  docs.forEach(doc => {
    const div = document.createElement("div");
    div.className = "doc";
    const title = document.createElement("strong");
    title.textContent = doc.filename;
    const details = document.createElement("p");
    details.textContent = "Category: " + doc.category + " | Owner: " + (doc.owner || doc.owner_id);
    const download = document.createElement("button");
    download.textContent = "Download";
    download.onclick = async () => {
      try {
        const response = await fetch(API + "/documents/" + doc.id + "/download", {
          headers:{Authorization:"Bearer " + token}
        });
        if (!response.ok) throw new Error("Download failed: " + response.status);
        const blob = await response.blob();
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = doc.filename;
        link.click();
        URL.revokeObjectURL(link.href);
      } catch(err) { showMessage(err.message); }
    };
    div.append(title, details, download);
    area.append(div);
  });
}

document.getElementById("uploadForm").addEventListener("submit", async e => {
  e.preventDefault();
  const file = document.getElementById("documentFile").files[0];
  if (!file) return;
  const form = new FormData();
  form.append("file", file);
  form.append("category", document.getElementById("category").value);
  try {
    await request("/documents/upload", {method:"POST", body:form});
    showMessage("Upload successful.");
    await loadDocuments();
  } catch(err) { showMessage(err.message); }
});

function logout() {
  token = "";
  currentUsername = "";
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
  document.getElementById("password").value = "";
  showMessage("Logged out.");
}
</script>
</body>
</html>
